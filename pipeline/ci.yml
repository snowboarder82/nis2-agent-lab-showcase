# CI = continuous integration: GitHub runs these checks on a fresh Linux machine
# for every pull request and every change to main. Since H11, main refuses a pull request
# until both jobs pass (the ruleset), and every action is pinned to the full ID of one
# commit, so the code that runs can't change behind your back.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# The jobs may only read the code. They can't push, comment or touch anything else.
permissions:
  contents: read

# A newer push to the same pull request stops the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned packages
        run: python -m pip install -r requirements.txt

      - name: Check the settings template has no real values
        run: python tools/check_settings.py --example-only

      - name: Check the golden set against the answer key
        run: python -m eval.golden

      - name: Run the tests, the offline evaluation included
        run: python -m pytest

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same scanner and version as your Mac's commit hook (H1). The download is checked
      # against the checksum gitleaks published for it, so a swapped file stops the job.
      - name: Install gitleaks 8.30.1
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan every commit in the history for secrets
        run: ./gitleaks git --redact --verbose --no-banner